[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "he_looming_sdk"
version = "0.6.5"
description = "Local homomorphic-encryption SDK with OpenFHE and FIDES execution backends"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.optional-dependencies]
cpu = ["openfhe==1.5.1.0.24.4"]
gpu = ["he-sdk-fides==0.3.4"]

[tool.setuptools.packages.find]
where = ["."]
include = ["common*", "he_sdk*", "openfhe_cpu*", "he_client*"]
