[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "he_looming_sdk"
version = "0.4.1"
description = "Local homomorphic-encryption SDK with OpenFHE and planned FIDES backends"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
openfhe = ["openfhe==1.5.1.0.24.4"]

[tool.setuptools.packages.find]
where = ["."]
include = ["common*", "he_sdk*", "openfhe_cpu*", "he_client*"]
