schema_version = 2
profile = "ckks-balanced-v1"
sdk_version = "0.5.0.dev0"
status = "chunking-development"

[python]
minimum = "3.10"
ci = "3.12"

[openfhe]
python_distribution = "openfhe==1.5.1.0.24.4"
scheme = "CKKS"
security_level = "HEStd_128_classic"
multiplicative_depth = 3
ring_dimension = 16384
batch_size = 8192
first_modulus_size = 60
scaling_modulus_size = 50
scaling_technique = "FLEXIBLEAUTO"
serialization = "openfhe-binary-v1"
workspace_format = "he-sdk-workspace-v2"
reads_workspace_v1 = true
compute_workspace_decryption = false

[chunking]
automatic = true
default_chunk_size = 8192
streaming_iterable = true
streaming_csv = true
global_sum = true
global_mean = true
global_population_variance = true
bootstrapping = false

[security]
secret_key_owner = "local HESession or trusted client only"
secret_key_persisted_in_workspace = false
evaluator_secret_key_allowed = false
