[build-system]
requires = [
  "scikit-build-core>=0.10,<1",
  "pybind11>=2.13,<4",
]
build-backend = "scikit_build_core.build"

[project]
name = "he-sdk-fides"
version = "0.3.1"
description = "CUDA FIDESlib backend installed by he_looming_sdk"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[tool.scikit-build]
cmake.version = ">=3.25.2"
wheel.packages = ["src/he_sdk_fides"]
build-dir = "build/{wheel_tag}"
