include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

stages:
  - validate
  - test
  - secret-detection
  - build

variables:
  OPENFHE_CPU_IMAGE: "$CI_REGISTRY_IMAGE/openfhe-evaluator-cpu:$CI_COMMIT_SHA"
  SECRET_DETECTION_ENABLED: "true"

sast:
  stage: test

secret_detection:
  stage: secret-detection

validate-files:
  stage: validate
  image: alpine:3.22
  script:
    - test -f Dockerfile
    - test -f requirements.txt
    - test -f api/app.py
    - test -f common/operations.py
    - test -f tests/test_app.py
    - grep -Fq 'openfhe==1.5.1.0.24.4' requirements.txt
    - test "$(wc -l < requirements.txt)" -eq 1
    - echo "Required CPU OpenFHE evaluator files exist."

test-he:
  stage: test
  image: python:3.12-alpine
  script:
    - python -m unittest discover -s tests -v

build-openfhe-evaluator-cpu:
  stage: build
  image:
    name: moby/buildkit:rootless
    entrypoint: [""]
  variables:
    BUILDKITD_FLAGS: --oci-worker-no-process-sandbox
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  before_script:
    - mkdir -p "$HOME/.docker"
    - |
      printf '%s' \
        "{\"auths\":{\"$CI_REGISTRY\":{\"username\":\"$CI_REGISTRY_USER\",\"password\":\"$CI_REGISTRY_PASSWORD\"}}}" \
        > "$HOME/.docker/config.json"
  script:
    - echo "Building $OPENFHE_CPU_IMAGE"
    - |
      buildctl-daemonless.sh build \
        --frontend dockerfile.v0 \
        --local context=. \
        --local dockerfile=. \
        --output type=image,name="$OPENFHE_CPU_IMAGE",push=true
