stages:
  - test
  - build

variables:
  OPENFHE_GATEWAY_IMAGE: "$CI_REGISTRY_IMAGE/openfhe-gateway:$CI_COMMIT_SHA"

test-he:
  stage: test
  image: python:3.12-alpine
  script:
    - python -m unittest discover -s tests -v

build-openfhe-gateway:
  stage: build
  image:
    name: moby/buildkit:rootless
    entrypoint: [""]
  variables:
    BUILDKITD_FLAGS: --oci-worker-no-process-sandbox
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - Dockerfile
        - requirements.txt
        - gateway/**/*
        - he_client/**/*
        - client/gateway_trial.py
  before_script:
    - mkdir -p "$HOME/.docker"
    - |
      printf '%s' \
        "{\"auths\":{\"$CI_REGISTRY\":{\"username\":\"$CI_REGISTRY_USER\",\"password\":\"$CI_REGISTRY_PASSWORD\"}}}" \
        > "$HOME/.docker/config.json"
  script:
    - echo "Building $OPENFHE_GATEWAY_IMAGE"
    - |
      buildctl-daemonless.sh build \
        --frontend dockerfile.v0 \
        --local context=. \
        --local dockerfile=. \
        --output type=image,name="$OPENFHE_GATEWAY_IMAGE",push=true
