include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

# Run every ordinary CI job on the non-GPU self-hosted runner. GPU runtime
# verification happens after deployment on the K3s GPU node.
default:
  tags:
    - k3s

stages:
  - validate
  - test
  - secret-detection
  - package
  - publish
  - build

variables:
  OPENFHE_CPU_IMAGE: "docker.io/dockerboi99/he_k8s:cpu-$CI_COMMIT_SHORT_SHA"
  OPENFHE_CPU_LATEST: "docker.io/dockerboi99/he_k8s:cpu-latest"
  FIDES_GPU_IMAGE: "docker.io/dockerboi99/he_k8s:gpu-$CI_COMMIT_SHORT_SHA"
  FIDES_GPU_LATEST: "docker.io/dockerboi99/he_k8s:gpu-latest"
  FIDESLIB_ARCH: "75-real"
  BUILD_JOBS: "4"
  SDK_WHEEL_DIR: "dist"
  FIDES_SDK_WHEEL_DIR: "fides-dist"
  SECRET_DETECTION_ENABLED: "true"

sast:
  stage: test

secret_detection:
  stage: secret-detection

validate-files:
  stage: validate
  image: alpine:3.22
  script:
    - test -f Dockerfile
    - test -f requirements.txt
    - test -f api/app.py
    - test -f backends/openfhe_python.py
    - test -f backends/openfhe_bgv_demo.py
    - test -f backends/openfhe_demo.py
    - test -f backends/openfhe_demo_sum.py
    - test -f common/operations.py
    - test -f openfhe_cpu/runtime.py
    - test -f he_sdk/__init__.py
    - test -f he_sdk/session.py
    - test -f he_sdk/config.py
    - test -f he_sdk/ciphertext.py
    - test -f he_sdk/operations.py
    - test -f he_sdk/smoke.py
    - test -f he_sdk/backends/base.py
    - test -f he_sdk/backends/openfhe.py
    - test -f scripts/sdk/compare_smoke_results.py
    - test -f compatibility/he-sdk-v1.toml
    - test -f examples/sdk/local_openfhe.py
    - test -f examples/sdk/local_fides.py
    - test -f tests/test_sdk.py
    - test -f tests/test_sdk_fides_plugin.py
    - test -f tests/test_sdk_smoke_compare.py
    - test -f tests/test_sdk_openfhe_adapter.py
    - test -f tests/test_sdk_openfhe_integration.py
    - test -f docs/he-sdk-architecture.md
    - test -f docs/he-sdk-fides.md
    - test -f docs/he-sdk-gitlab-registry.md
    - test -f client/cpu_service_demo.py
    - test -f client/direct_openfhe_cpu_test.py
    - test -f tests/test_app.py
    - test -f tests/test_gpu_api.py
    - test -f tests/test_gpu_source_contract.py
    - test -f docs/gpu-known-errors.md
    - test -f gpu/Dockerfile
    - test -f gpu/api/app.py
    - test -f gpu/he_sdk_fides/pyproject.toml
    - test -f gpu/he_sdk_fides/CMakeLists.txt
    - test -f gpu/he_sdk_fides/native/bindings.cpp
    - test -f gpu/he_sdk_fides/src/he_sdk_fides/backend.py
    - test -f gpu/client/simple_test.py || test -f gpu/client/simple_test.txt
    - test -f gpu/worker/CMakeLists.txt
    - test -f gpu/worker/src/main.cpp
    - test -f gpu/worker/src/demo_main.cpp
    - test -f gpu/worker/src/fides_backend.cpp
    - test -f gpu/worker/src/fides_backend.hpp
    - grep -Fq 'openfhe==1.5.1.0.24.4' requirements.txt
    - grep -Fq 'numpy>=2.0,<3' requirements.txt
    - grep -Fq 'pandas>=2.2,<3' requirements.txt
    - test "$(grep -Ev '^[[:space:]]*(#|$)' requirements.txt | wc -l | tr -d ' ')" -eq 3
    - echo "Required CPU OpenFHE evaluator files exist."

test-he:
  stage: test
  image: python:3.12-alpine
  script:
    - python -m unittest discover -s tests -v

test-sdk-openfhe:
  stage: test
  image:
    name: "$OPENFHE_CPU_LATEST"
    entrypoint: [""]
  rules:
    - changes:
        - .gitlab-ci.yml
        - pyproject.toml
        - compatibility/**/*
        - examples/sdk/**/*
        - he_sdk/**/*
        - openfhe_cpu/**/*
        - tests/test_sdk.py
        - tests/test_sdk_openfhe_adapter.py
        - tests/test_sdk_openfhe_integration.py
  script:
    - python -c 'import openfhe; print("OpenFHE integration dependency is available")'
    - python -m unittest tests.test_sdk_openfhe_integration -v
    - python -m he_sdk.smoke > openfhe-smoke.txt
    - cat openfhe-smoke.txt
  artifacts:
    paths:
      - openfhe-smoke.txt
    expire_in: 7 days

build-sdk-wheel:
  stage: package
  image: python:3.12-alpine
  before_script:
    - python -m pip install --disable-pip-version-check 'build==1.3.0'
  script:
    - python -m build --wheel --outdir "$SDK_WHEEL_DIR"
    - cd "$SDK_WHEEL_DIR" && sha256sum he_looming_sdk-*.whl > SHA256SUMS && cd ..
    - python -m pip install --no-deps "$SDK_WHEEL_DIR"/*.whl
    - python -I -c 'from he_sdk import CKKSConfig, HESession; print(CKKSConfig.profile("ckks-balanced-v1").fingerprint)'
  artifacts:
    name: "he-sdk-$CI_COMMIT_SHORT_SHA"
    paths:
      - dist/*.whl
      - dist/SHA256SUMS
      - compatibility/he-sdk-v1.toml
    expire_in: 60 days

build-fides-sdk-wheel:
  stage: package
  image:
    name: moby/buildkit:rootless
    entrypoint: [""]
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
    GIT_SUBMODULE_FORCE_HTTPS: "true"
    BUILDKITD_FLAGS: --oci-worker-no-process-sandbox
  rules:
    - if: '$CI_COMMIT_TAG =~ /^fides-v[0-9]+\.[0-9]+\.[0-9]+$/'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - .gitlab-ci.yml
        - gpu/Dockerfile
        - gpu/he_sdk_fides/**/*
        - gpu/worker/**/*
      when: manual
      allow_failure: true
  script:
    - |
      buildctl-daemonless.sh build \
        --frontend dockerfile.v0 \
        --local context=gpu \
        --local dockerfile=gpu \
        --opt target=sdk-wheel \
        --opt build-arg:FIDESLIB_ARCH="$FIDESLIB_ARCH" \
        --opt build-arg:BUILD_JOBS="$BUILD_JOBS" \
        --output "type=local,dest=$FIDES_SDK_WHEEL_DIR"
    - test -n "$(find "$FIDES_SDK_WHEEL_DIR" -maxdepth 1 -name 'he_sdk_fides-*.whl' -print -quit)"
  artifacts:
    name: "he-sdk-fides-$CI_COMMIT_SHORT_SHA"
    paths:
      - fides-dist/*.whl
    expire_in: 60 days

publish-sdk-gitlab:
  stage: publish
  image: python:3.12-alpine
  dependencies:
    - build-sdk-wheel
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
  before_script:
    - python -m pip install --disable-pip-version-check 'twine>=6,<7'
  script:
    - |
      PACKAGE_VERSION="$(python -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
      test "$CI_COMMIT_TAG" = "v$PACKAGE_VERSION"
    - |
      TWINE_USERNAME=gitlab-ci-token \
      TWINE_PASSWORD="$CI_JOB_TOKEN" \
      python -m twine upload \
        --non-interactive \
        --repository-url "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/pypi" \
        dist/*.whl

publish-sdk-pypi:
  stage: publish
  image: python:3.12-alpine
  dependencies:
    - build-sdk-wheel
  id_tokens:
    PYPI_ID_TOKEN:
      aud: pypi
  environment:
    name: pypi
    url: https://pypi.org/project/he-looming-sdk/
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
  before_script:
    - python -m pip install --disable-pip-version-check 'twine>=6,<7'
  script:
    - |
      PACKAGE_VERSION="$(python -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
      test "$CI_COMMIT_TAG" = "v$PACKAGE_VERSION"
    - python -m twine check dist/*.whl
    # Twine exchanges this job's short-lived PYPI_ID_TOKEN for a temporary
    # upload token. No long-lived PyPI token is stored in GitLab.
    - python -m twine upload --non-interactive dist/*.whl

publish-fides-sdk-gitlab:
  stage: publish
  image: python:3.12-alpine
  dependencies:
    - build-fides-sdk-wheel
  rules:
    - if: '$CI_COMMIT_TAG =~ /^fides-v[0-9]+\.[0-9]+\.[0-9]+$/'
  before_script:
    - python -m pip install --disable-pip-version-check 'twine>=6,<7'
  script:
    - |
      PACKAGE_VERSION="$(python -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("gpu/he_sdk_fides/pyproject.toml").read_text())["project"]["version"])')"
      test "$CI_COMMIT_TAG" = "fides-v$PACKAGE_VERSION"
    - python -m twine check "$FIDES_SDK_WHEEL_DIR"/*.whl
    - |
      TWINE_USERNAME=gitlab-ci-token \
      TWINE_PASSWORD="$CI_JOB_TOKEN" \
      python -m twine upload \
        --non-interactive \
        --repository-url "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/pypi" \
        "$FIDES_SDK_WHEEL_DIR"/*.whl

build-openfhe-evaluator-cpu:
  stage: build
  image:
    name: moby/buildkit:rootless
    entrypoint: [""]
  variables:
    BUILDKITD_FLAGS: --oci-worker-no-process-sandbox
  dependencies:
    - build-sdk-wheel
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $DOCKERHUB_USERNAME && $DOCKERHUB_TOKEN'
      changes:
        - .gitlab-ci.yml
        - Dockerfile
        - requirements.txt
        - api/**/*
        - backends/**/*
        - common/**/*
        - he_sdk/**/*
        - client/__init__.py
        - client/cpu_service_demo.py
        - openfhe_cpu/**/*
        - pyproject.toml
    # Keep a manual recovery button when an earlier test failure prevented a
    # CPU-related commit from ever reaching the build stage.
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $DOCKERHUB_USERNAME && $DOCKERHUB_TOKEN'
      when: manual
      allow_failure: true
  before_script:
    - mkdir -p "$HOME/.docker"
    - |
      DOCKERHUB_AUTH="$(printf '%s:%s' "$DOCKERHUB_USERNAME" "$DOCKERHUB_TOKEN" | base64 | tr -d '\n')"
      printf '{"auths":{"https://index.docker.io/v1/":{"auth":"%s"}}}' \
        "$DOCKERHUB_AUTH" > "$HOME/.docker/config.json"
  script:
    - echo "Building $OPENFHE_CPU_IMAGE and $OPENFHE_CPU_LATEST"
    - |
      buildctl-daemonless.sh build \
        --frontend dockerfile.v0 \
        --local context=. \
        --local dockerfile=. \
        --output "type=image,\"name=$OPENFHE_CPU_IMAGE,$OPENFHE_CPU_LATEST\",push=true"

build-fides-evaluator-gpu:
  stage: build
  image:
    name: moby/buildkit:rootless
    entrypoint: [""]
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
    GIT_SUBMODULE_FORCE_HTTPS: "true"
    BUILDKITD_FLAGS: --oci-worker-no-process-sandbox
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $DOCKERHUB_USERNAME && $DOCKERHUB_TOKEN'
      changes:
        - .gitlab-ci.yml
        - .gitmodules
        - gpu/**/*
        - tests/test_gpu_source_contract.py
        - tests/test_gpu_api.py
    # Keep a manual recovery button when an earlier test failure prevented a
    # GPU-related commit from ever reaching the build stage.
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $DOCKERHUB_USERNAME && $DOCKERHUB_TOKEN'
      when: manual
      allow_failure: true
  before_script:
    - mkdir -p "$HOME/.docker"
    - |
      DOCKERHUB_AUTH="$(printf '%s:%s' "$DOCKERHUB_USERNAME" "$DOCKERHUB_TOKEN" | base64 | tr -d '\n')"
      printf '{"auths":{"https://index.docker.io/v1/":{"auth":"%s"}}}' \
        "$DOCKERHUB_AUTH" > "$HOME/.docker/config.json"
  script:
    # CUDA code is compiled by the CUDA toolchain in the image. This runner
    # does not execute the resulting binaries; runtime validation is performed
    # by the GitOps deployment on a K3s node with an NVIDIA GPU.
    - echo "Building $FIDES_GPU_IMAGE and $FIDES_GPU_LATEST for CUDA architecture $FIDESLIB_ARCH"
    - |
      buildctl-daemonless.sh build \
        --frontend dockerfile.v0 \
        --local context=gpu \
        --local dockerfile=gpu \
        --opt build-arg:FIDESLIB_ARCH="$FIDESLIB_ARCH" \
        --opt build-arg:BUILD_JOBS="$BUILD_JOBS" \
        --opt build-arg:VCS_REF="$CI_COMMIT_SHA" \
        --opt build-arg:SOURCE_URL="$CI_PROJECT_URL" \
        --opt build-arg:BUILD_URL="$CI_PIPELINE_URL" \
        --output "type=image,\"name=$FIDES_GPU_IMAGE,$FIDES_GPU_LATEST\",push=true"
