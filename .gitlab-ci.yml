include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

stages:
  - validate
  - test
  - secret-detection
  - build

variables:
  OPENFHE_GATEWAY_IMAGE: "$CI_REGISTRY_IMAGE/openfhe-gateway:$CI_COMMIT_SHA"
  SECRET_DETECTION_ENABLED: "true"

sast:
  stage: test

secret_detection:
  stage: secret-detection

validate-files:
  stage: validate
  image: alpine:3.22
  script:
    - test -f Dockerfile
    - test -f requirements.txt
    - test -f client/boss_demo.py
    - test -f client/gateway_trial.py
    - test -f client/heir_trial.py
    - test -f gateway/app.py
    - test -f gateway/heir_adjusted_net.py
    - test -f he_client/client.py
    - test -f tests/test_gateway_client.py
    - test -f tests/test_heir_adjusted_net.py
    - grep -Fq 'heir_py[python,openfhe]==2026.7.1' requirements.txt
    - echo "Required OpenFHE and HEIR gateway files exist."

test-he:
  stage: test
  image: python:3.12-alpine
  script:
    - python -m unittest discover -s tests -v

build-openfhe-gateway:
  stage: build
  image:
    name: moby/buildkit:rootless
    entrypoint: [""]
  variables:
    BUILDKITD_FLAGS: --oci-worker-no-process-sandbox
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - Dockerfile
        - requirements.txt
        - gateway/**/*
        - he_client/**/*
        - client/gateway_trial.py
        - client/heir_trial.py
  before_script:
    - mkdir -p "$HOME/.docker"
    - |
      printf '%s' \
        "{\"auths\":{\"$CI_REGISTRY\":{\"username\":\"$CI_REGISTRY_USER\",\"password\":\"$CI_REGISTRY_PASSWORD\"}}}" \
        > "$HOME/.docker/config.json"
  script:
    - echo "Building $OPENFHE_GATEWAY_IMAGE"
    - |
      buildctl-daemonless.sh build \
        --frontend dockerfile.v0 \
        --local context=. \
        --local dockerfile=. \
        --output type=image,name="$OPENFHE_GATEWAY_IMAGE",push=true
