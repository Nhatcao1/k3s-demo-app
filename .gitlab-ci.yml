include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

stages:
  - validate
  - test
  - secret-detection
  - build

variables:
  OPENFHE_CPU_IMAGE: "docker.io/dockerboi99/he_k8s:cpu-$CI_COMMIT_SHA"
  OPENFHE_CPU_LATEST: "docker.io/dockerboi99/he_k8s:cpu-latest"
  FIDES_GPU_IMAGE: "docker.io/dockerboi99/he_k8s:gpu-$CI_COMMIT_SHA"
  FIDES_GPU_LATEST: "docker.io/dockerboi99/he_k8s:gpu-latest"
  FIDES_GPU_EXAMPLES: "docker.io/dockerboi99/he_k8s:gpu-t4-examples"
  FIDESLIB_ARCH: "75-real"
  BUILD_JOBS: "4"
  SECRET_DETECTION_ENABLED: "true"

sast:
  stage: test

secret_detection:
  stage: secret-detection

validate-files:
  stage: validate
  image: alpine:3.22
  script:
    - test -f Dockerfile
    - test -f requirements.txt
    - test -f api/app.py
    - test -f backends/openfhe_python.py
    - test -f common/operations.py
    - test -f openfhe_cpu/runtime.py
    - test -f client/cpu_service_demo.py
    - test -f client/direct_openfhe_cpu_test.py
    - test -f demo/cpu-postgres/cpu_postgres_demo/cli.py
    - test -f tests/test_app.py
    - test -f tests/test_gpu_api.py
    - test -f gpu/Dockerfile
    - test -f gpu/api/app.py
    - test -f gpu/worker/CMakeLists.txt
    - test -f gpu/worker/src/main.cpp
    - test -f gpu/worker/src/fides_backend.cpp
    - test -f gpu/worker/src/fides_backend.hpp
    - grep -Fq 'openfhe==1.5.1.0.24.4' requirements.txt
    - grep -Fq 'cryptography>=43,<48' requirements.txt
    - grep -Fq 'psycopg[binary]>=3.2,<4' requirements.txt
    - test "$(wc -l < requirements.txt)" -eq 3
    - echo "Required CPU OpenFHE evaluator files exist."

test-he:
  stage: test
  image: python:3.12-alpine
  script:
    - python -m unittest discover -s tests -v

build-openfhe-evaluator-cpu:
  stage: build
  image:
    name: moby/buildkit:rootless
    entrypoint: [""]
  variables:
    BUILDKITD_FLAGS: --oci-worker-no-process-sandbox
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $DOCKERHUB_USERNAME && $DOCKERHUB_TOKEN'
      variables:
        OPENFHE_CPU_CHANNEL: "docker.io/dockerboi99/he_k8s:cpu-latest"
      changes:
        - .gitlab-ci.yml
        - Dockerfile
        - requirements.txt
        - api/**/*
        - backends/**/*
        - common/**/*
        - client/__init__.py
        - client/cpu_service_demo.py
        - demo/cpu-postgres/**/*
        - openfhe_cpu/**/*
    - if: '$CI_COMMIT_BRANCH == "feat/cpu-postgres-demo" && $DOCKERHUB_USERNAME && $DOCKERHUB_TOKEN'
      variables:
        OPENFHE_CPU_CHANNEL: "docker.io/dockerboi99/he_k8s:cpu-postgres-demo"
      changes:
        - .gitlab-ci.yml
        - Dockerfile
        - requirements.txt
        - api/**/*
        - backends/**/*
        - common/**/*
        - client/__init__.py
        - client/cpu_service_demo.py
        - demo/cpu-postgres/**/*
        - openfhe_cpu/**/*
  before_script:
    - mkdir -p "$HOME/.docker"
    - |
      DOCKERHUB_AUTH="$(printf '%s:%s' "$DOCKERHUB_USERNAME" "$DOCKERHUB_TOKEN" | base64 | tr -d '\n')"
      printf '{"auths":{"https://index.docker.io/v1/":{"auth":"%s"}}}' \
        "$DOCKERHUB_AUTH" > "$HOME/.docker/config.json"
  script:
    - echo "Building $OPENFHE_CPU_IMAGE and $OPENFHE_CPU_CHANNEL"
    - |
      buildctl-daemonless.sh build \
        --frontend dockerfile.v0 \
        --local context=. \
        --local dockerfile=. \
        --output "type=image,\"name=$OPENFHE_CPU_IMAGE,$OPENFHE_CPU_CHANNEL\",push=true"

build-fides-evaluator-gpu:
  stage: build
  image:
    name: moby/buildkit:rootless
    entrypoint: [""]
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
    GIT_SUBMODULE_FORCE_HTTPS: "true"
    BUILDKITD_FLAGS: --oci-worker-no-process-sandbox
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $DOCKERHUB_USERNAME && $DOCKERHUB_TOKEN'
      changes:
        - .gitlab-ci.yml
        - .gitmodules
        - gpu/**/*
      when: manual
      allow_failure: true
  before_script:
    - mkdir -p "$HOME/.docker"
    - |
      DOCKERHUB_AUTH="$(printf '%s:%s' "$DOCKERHUB_USERNAME" "$DOCKERHUB_TOKEN" | base64 | tr -d '\n')"
      printf '{"auths":{"https://index.docker.io/v1/":{"auth":"%s"}}}' \
        "$DOCKERHUB_AUTH" > "$HOME/.docker/config.json"
  script:
    - echo "Building $FIDES_GPU_IMAGE, $FIDES_GPU_LATEST, and $FIDES_GPU_EXAMPLES for CUDA architecture $FIDESLIB_ARCH"
    - |
      buildctl-daemonless.sh build \
        --frontend dockerfile.v0 \
        --local context=gpu \
        --local dockerfile=gpu \
        --opt build-arg:FIDESLIB_ARCH="$FIDESLIB_ARCH" \
        --opt build-arg:BUILD_JOBS="$BUILD_JOBS" \
        --output "type=image,\"name=$FIDES_GPU_IMAGE,$FIDES_GPU_LATEST,$FIDES_GPU_EXAMPLES\",push=true"
