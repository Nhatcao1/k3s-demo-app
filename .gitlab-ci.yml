include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

stages:
  - validate
  - test
  - secret-detection
  - build

variables:
  WEB_IMAGE: "$CI_REGISTRY_IMAGE/web:$CI_COMMIT_SHORT_SHA"
  API_IMAGE: "$CI_REGISTRY_IMAGE/api:$CI_COMMIT_SHORT_SHA"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  SECRET_DETECTION_ENABLED: "true"

sast:
  stage: test

secret_detection:
  stage: secret-detection

validate-files:
  stage: validate
  image: alpine:3.22
  script:
    - test -f web/index.html
    - test -f web/nginx.conf
    - test -f web/Dockerfile
    - test -f api/app.py
    - test -f api/requirements.txt
    - test -f api/Dockerfile
    - test -f api/tests/test_app.py
    - echo "Required files exist."

test-api:
  stage: test
  image: python:3.13-alpine
  cache:
    key: pip
    paths:
      - .cache/pip
  before_script:
    - python -m pip install -r api/requirements.txt
  script:
    - cd api
    - python -m unittest discover -s tests -v

.build-image:
  stage: build
  image:
    name: moby/buildkit:rootless
    entrypoint: [""]
  variables:
    BUILDKITD_FLAGS: --oci-worker-no-process-sandbox
  before_script:
    - mkdir -p "$HOME/.docker"
    - |
      printf '%s' \
        "{\"auths\":{\"$CI_REGISTRY\":{\"username\":\"$CI_REGISTRY_USER\",\"password\":\"$CI_REGISTRY_PASSWORD\"}}}" \
        > "$HOME/.docker/config.json"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

build-web:
  extends: .build-image
  script:
    - echo "Building $WEB_IMAGE"
    - |
      buildctl-daemonless.sh build \
        --frontend dockerfile.v0 \
        --local context=web \
        --local dockerfile=web \
        --output type=image,name="$WEB_IMAGE",push=true

build-api:
  extends: .build-image
  script:
    - echo "Building $API_IMAGE"
    - |
      buildctl-daemonless.sh build \
        --frontend dockerfile.v0 \
        --local context=api \
        --local dockerfile=api \
        --output type=image,name="$API_IMAGE",push=true
