<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>K3s GitOps Counter</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
    }

    body {
      display: grid;
      min-height: 100vh;
      margin: 0;
      place-items: center;
      background: #111827;
      color: #f9fafb;
    }

    .card {
      width: min(680px, calc(100% - 64px));
      padding: 32px;
      border: 1px solid #374151;
      border-radius: 16px;
      background: #1f2937;
      box-shadow: 0 18px 50px rgb(0 0 0 / 30%);
    }

    h1 {
      margin-top: 0;
    }

    #count {
      margin: 12px 0;
      color: #6ee7b7;
      font-size: 64px;
      font-weight: 800;
    }

    #status {
      color: #d1d5db;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>GitLab CI + Argo CD + K3s</h1>
    <p>Application version: <strong>v1</strong></p>
    <p>Redis-backed visit count:</p>
    <div id="count" aria-live="polite">Loading…</div>
    <p id="status"></p>
  </main>

  <script>
    async function recordVisit() {
      const count = document.getElementById("count");
      const status = document.getElementById("status");

      try {
        const response = await fetch("/api/visit");
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const result = await response.json();
        count.textContent = result.visits;
        status.textContent = `Environment: ${result.environment} · API Pod: ${result.hostname}`;
      } catch (error) {
        count.textContent = "Error";
        status.textContent = String(error);
      }
    }

    recordVisit();
  </script>
</body>
</html>
